# cfgs/dataset_configs/SuperquadricSDF.yaml

NAME: SuperquadricSDFDataset

# Folder that CONTAINS train.txt and test.txt
DATA_PATH: /home/tylerich/work/Master_Arbeit/point-mae-zero/procedural_data_gen/2k

# Folder that CONTAINS shard_00000/, shard_00001/, ...
# (the loader scans all subdirs here and opens each as an LMDB env)
PC_PATH: /home/tylerich/work/Master_Arbeit/point-mae-zero/procedural_data_gen/2k

USE_LMDB: true

# How many points to sample from each cloud for the encoder input
N_POINTS: 1024

# Whether to merge train/test (mirrors ZeroVerse; not used heavily yet)
whole: false

# SDF sampling options used in SuperquadricSDFDataset
#SQ_SDF_SAMPLING: grid         # current implementation
#SQ_SDF_GRID_RES: 16           # grid resolution → M = 32^3 query points
SQ_SDF_SAMPLING: uniform_bbox
#SQ_SDF_SAMPLING: occ_balanced
# SQ_SDF_GRID_RES: 32        # still used to build the candidate grid
SQ_SDF_N_QUERY: 8192       # or 8192, etc.
# SQ_OCC_BAND: 0.1           # "near surface" |f-1| < 0.1
# SQ_OCC_NEAR_FRACTION: 0.5  # 50% of inside / outside from near-surface band
# SQ_OCC_INSIDE_FRACTION: 0.5  # ~50% inside, 50% outside
# SQ_SDF_SAMPLING: surface_jitter
# SQ_JITTER_FACTOR: 8          # or whatever you want
# SQ_JITTER_SIGMA: 0.1        # tweak based on scale of your SQs
